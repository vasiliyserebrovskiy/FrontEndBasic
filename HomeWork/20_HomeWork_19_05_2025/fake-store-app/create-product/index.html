<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../js/create-product.js" defer></script>
    <link rel="stylesheet" href="../css/create-product.css" />
    <title>Create new product</title>
  </head>
  <body>
    <form id="add-product-form" class="add-product-form">
      <div class="parameter-group">
        <label for="title">Title:</label>
        <input type="text" name="title" placeholder="titel" id="title" />
      </div>
      <div class="parameter-group">
        <label for="price">Price:</label>
        <input type="text" name="price" placeholder="price" id="price" />
      </div>
      <div class="parameter-group">
        <label for="category-select">Category:</label>
        <select
          name="category"
          id="category-select"
          class="category-select"
        ></select>
      </div>
      <div class="parameter-group">
        <label for="image">Image URL:</label>
        <input type="text" name="image" placeholder="img URL" id="image" />
      </div>
      <div class="parameter-group">
        <label for="description">Description:</label>
        <input
          type="text"
          name="description"
          placeholder="description"
          id="description"
        />
      </div>
      <button type="submit" class="submit-btn">Add product</button>
    </form>
  </body>
</html>
